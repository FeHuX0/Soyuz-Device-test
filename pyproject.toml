[project]
name = "ai-product-assistant"
version = "0.1.0"
description = "AI-помощник для подготовки карточек приборов КИП"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "instructor>=1.17,<1.18",
    "openai>=3.3,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]
